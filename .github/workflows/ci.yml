name: CI

on: [push, pull_request]

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - run: cargo fmt -- --check

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - name: Install clippy
        run: rustup component add clippy
      - name: Install FlatBuffers compiler
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 'https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang%2B%2B-18.zip' -o "$RUNNER_TEMP/flatc.zip"
          echo '50c1915deeeb714f2a05c8ec795bd1af898d251a62e2774067703b29188efc90  '"$RUNNER_TEMP/flatc.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/flatc.zip" flatc > "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flatc" --version
      - run: cargo clippy --all-features -- --deny warnings

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - name: Install FlatBuffers compiler
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 'https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang%2B%2B-18.zip' -o "$RUNNER_TEMP/flatc.zip"
          echo '50c1915deeeb714f2a05c8ec795bd1af898d251a62e2774067703b29188efc90  '"$RUNNER_TEMP/flatc.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/flatc.zip" flatc > "$RUNNER_TEMP/flatc"
          chmod +x "$RUNNER_TEMP/flatc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flatc" --version
      - run: cargo test --all-features
      - run: cargo test -p somen-pod5 --no-default-features
      - run: cargo test -p somen-pod5 --no-default-features --features backend
